name: Acquire Unity Activation File

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request manual activation file (.alf)
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:2019.3.6f1-base-3
    steps:
      - name: Request manual activation file
        run: |
          unity-editor -batchmode -nographics -createManualActivationFile -logfile /dev/stdout || true
          ls -la *.alf || true

      - name: Upload manual activation file
        uses: actions/upload-artifact@v4
        with:
          name: manual-activation-file
          path: '*.alf'
